name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build Windows EXEs
        run: npm run dist:win
      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: weread-mini-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
